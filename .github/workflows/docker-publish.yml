name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  schedule:
    # Weekly rebuild: picks up new runner releases and Ubuntu security fixes.
    # GitHub stops sending jobs to runners that fall too far behind.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      runner_version:
        description: "Runner version to build (blank = latest release)"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variable DOCKERHUB_USERNAME + secret DOCKERHUB_TOKEN are required to push.
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_REPO || 'github-runner' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Docker Hub configuration
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME == ''
        run: |
          echo "::error::Set repository variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN (Settings -> Secrets and variables -> Actions)."
          exit 1

      - name: Resolve runner version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.runner_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^ARG RUNNER_VERSION=//p' Dockerfile)
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            # Use the newer of the pinned version and the latest release, so a
            # push never republishes "latest" with an older runner than the
            # weekly build already shipped.
            latest=$(gh api repos/actions/runner/releases/latest --jq '.tag_name | ltrimstr("v")' || echo "$pinned")
            version=$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n1)
          fi
          echo "Pinned: $pinned  Building: $version"
          if [ "$version" != "$pinned" ]; then
            echo "::warning::Building runner $version but Dockerfile pins $pinned. Bump ARG RUNNER_VERSION."
          fi
          echo "runner=$version" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.runner }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            RUNNER_VERSION=${{ steps.version.outputs.runner }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
