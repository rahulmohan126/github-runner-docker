# Opt-in: give workflows access to the HOST Docker daemon.
#
# WARNING: anyone who can run a workflow on this runner gets root-equivalent
# control of the host. Use only with private repositories you fully control.
#
# Enable by adding to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.docker-socket.yml
#
# The entrypoint detects the socket's group ID at startup and grants the
# runner user access, so no DOCKER_GID setting is needed.
services:
  github-runner:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
