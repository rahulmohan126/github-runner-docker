# OPT-IN, off by default: give workflows the HOST Docker daemon, with host
# networking. Without it, jobs cannot use Docker at all: no docker
# build/run/compose, no Actions `services:` or `container:` jobs, no
# testcontainers. Route those jobs to a different runner.
#
# WARNING: anyone who can run a workflow on this runner gets ROOT ON THE HOST
# (e.g. `docker run --privileged -v /:/host ...`), and can control every other
# container on it, including other runners'. Only enable it on a machine
# where that is acceptable.
#
# Enable by adding to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.docker-socket.yml
#   DOCKER_GID=<group id of the socket, as seen inside a container>
# and add a `docker` label to RUNNER_LABELS (before registering), so
# workflows can target Docker-capable runners with runs-on: [self-hosted, docker].
#
# Find DOCKER_GID with (prints e.g. 999 on Linux, 0 on Docker Desktop):
#   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock busybox stat -c %g /var/run/docker.sock
#
# The container runs as the unprivileged runner user and cannot change its own
# groups, so the socket's group is added here instead.
services:
  github-runner:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env (see docker-compose.docker-socket.yml)}"
    # Containers started on the host daemon (Actions `services:`, testcontainers,
    # `docker run -p`, `docker compose up`) publish their ports on the HOST.
    # Job steps run inside this container, so it shares the host's network
    # namespace: localhost:5432 in a step then reaches a service's 5432:5432.
    # Side effect: anything a job listens on is listening on the host.
    network_mode: host
